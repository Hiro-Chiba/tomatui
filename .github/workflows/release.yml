name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Current toolchain (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Ubuntu
          - os: macos-latest
            label: macOS
          - os: windows-latest
            label: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install --no-self-update
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  build:
    name: Build (${{ matrix.target }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install --no-self-update
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -czf dist/tomatui-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release tomatui
      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist
          Compress-Archive -Path target/${{ matrix.target }}/release/tomatui.exe -DestinationPath dist/tomatui-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v7
        with:
          name: tomatui-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish-crate:
    name: Publish crate
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: rustup toolchain install --no-self-update
      - name: Verify release metadata
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "tomatui") | .version')"
          test "$TAG" = "v$version"
          grep -F "## [$version]" CHANGELOG.md
          git merge-base --is-ancestor HEAD origin/main
      - run: cargo package --locked
      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

  github-release:
    name: Create GitHub Release
    needs: publish-crate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: rustup toolchain install --no-self-update
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Create checksums
        working-directory: artifacts
        run: sha256sum tomatui-* > checksums-sha256.txt
      - name: Generate dependency changes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cargo install whats-changed --version 1.0.0 --locked
          previous_tag="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "$previous_tag" ]; then
            whats-changed "$previous_tag" > dependency_changes.md
          else
            touch dependency_changes.md
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Markdown backticks below are literal, not shell substitutions.
          # shellcheck disable=SC2016
          {
            sed -n "/^## \[$version\]/,/^## \[/p" CHANGELOG.md | sed '1d;$d'
            printf '\n## Install\n\nDownload the archive for your OS from the assets below, extract it, and run `./tomatui` (Windows: `.\\tomatui.exe`). Rust is not required.\n\n'
            printf '| OS | Archive |\n| --- | --- |\n| macOS (Apple Silicon) | `tomatui-aarch64-apple-darwin.tar.gz` |\n| macOS (Intel) | `tomatui-x86_64-apple-darwin.tar.gz` |\n| Linux (x86-64) | `tomatui-x86_64-unknown-linux-gnu.tar.gz` |\n| Windows (x86-64) | `tomatui-x86_64-pc-windows-msvc.zip` |\n\n'
            printf 'Or build from source with Cargo:\n\n```bash\ncargo install --locked tomatui --version %s\n```\n\n' "$version"
            if [ -s dependency_changes.md ]; then
              printf '## Dependency changes\n\n'
              sed 's/^## Package:/### Package:/' dependency_changes.md
            fi
          } > release-notes.md

          gh release create "$GITHUB_REF_NAME" \
            artifacts/* \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
