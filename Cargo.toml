[package]
name = "tomatui"
version = "0.1.1"
edition = "2024"
authors = ["Hiro-Chiba"]
description = "Terminal Pomodoro timer with TUI, minimal mode, and stats tracking"
license = "MIT"
repository = "https://github.com/Hiro-Chiba/tomatui"
homepage = "https://github.com/Hiro-Chiba/tomatui"
readme = "README.md"
keywords = ["pomodoro", "timer", "tui", "productivity", "terminal"]
categories = ["command-line-utilities"]
rust-version = "1.93"
exclude = ["assets/", ".github/", "rust-toolchain.toml"]

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tui-big-text = "0.8"
