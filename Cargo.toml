[package]
name = "tomatui"
version = "0.1.0"
edition = "2021"
authors = ["Hiro-Chiba"]
description = "A beautiful terminal Pomodoro timer with TUI and minimal mode, statistics tracking, and macOS notifications"
license = "MIT"
repository = "https://github.com/Hiro-Chiba/tomatui"
homepage = "https://github.com/Hiro-Chiba/tomatui"
readme = "README.md"
keywords = ["pomodoro", "timer", "tui", "productivity", "terminal"]
categories = ["command-line-utilities"]
rust-version = "1.93"
exclude = ["assets/", ".github/"]

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
tui-big-text = "0.7"
